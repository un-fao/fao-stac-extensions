name: Validate Examples (pystac report)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  pystac-report:
    name: Per-example pystac validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pystac and jsonschema
        run: pip install pystac jsonschema
      - name: Validate every example with pystac (scoped + full-stack passes, summary on run page)
        run: python scripts/validate_with_pystac.py
