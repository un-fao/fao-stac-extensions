name: Check Markdown, JSON Schemas, and Python tests
on: [push, pull_request]
jobs:
  npm-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
      - uses: actions/checkout@v4
      - run: |
          npm install
          npm test
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
      - name: Install reference-implementation
        run: |
          cd reference-implementation
          pip install -e .[dev]
      - name: Run pytest
        run: |
          cd reference-implementation
          pytest -q
      - name: Validate examples with pystac (scoped gates the build; full-stack is informational)
        run: python scripts/validate_with_pystac.py
